<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4b2d6e" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Adm. Paroquial">
    <link rel="apple-touch-icon" href="icone-192.png" />

    <title>Carregando Administração...</title>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw-admin.js', { scope: './' }).catch(()=>{});
        }
        
        // Redireciona para a tela de links logo após o PWA ser reconhecido
        setTimeout(() => {
            window.location.replace('links.html');
        }, 500);
    </script>

    <style>
        body { background: #4b2d6e; color: #c9a24b; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        .spinner { border: 4px solid rgba(201,162,75,0.3); border-top: 4px solid #c9a24b; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        p { font-size: 14px; letter-spacing: 1px; text-transform: uppercase; opacity: 0.8; }
    </style>
</head>
<body>
    <div class="spinner"></div>
    <p>Verificando Acesso...</p>
</body>
</html>
