<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Administração Paroquial S.J.B.</title>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4b2d6e" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Adm. Paroquial">
    <link rel="apple-touch-icon" href="icone-192.png" />
    <style>
        body { background: #4b2d6e; color: #c9a24b; display: flex; flex-direction: column; gap: 12px; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; }
        a { color: #c9a24b; font-weight: bold; }
    </style>
    <script>
        (async function () {
            if ('serviceWorker' in navigator) {
                try {
                    await navigator.serviceWorker.register('sw-admin.js', { scope: './' });
                } catch (_) {}
            }
            location.replace('links.html');
        })();
    </script>
</head>
<body>
    <span>Carregando Administração...</span>
    <a href="links.html">Clique aqui se não abrir automaticamente</a>
</body>
</html>
