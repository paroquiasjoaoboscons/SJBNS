<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Administração Paroquial S.J.B.</title>
    
    <!-- Configuração PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#4b2d6e" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Adm. Paroquial">
    <link rel="apple-touch-icon" href="icone-192.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw-admin.js', { scope: './' }).catch(()=>{});
        }
    </script>

    <style>
        :root { --roxo: #4b2d6e; --roxo-2: #6d4a96; --dourado: #c9a24b; --creme: #faf6ee; --texto: #2e2339; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: var(--creme); color: var(--texto); min-height: 100vh; display: flex; flex-direction: column; }
        h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; }
        
        .topbar { background: linear-gradient(135deg, var(--roxo), var(--roxo-2)); color: #fff; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 16px; text-align: center; border-bottom: 4px solid var(--dourado); box-shadow: 0 4px 10px rgba(0,0,0,.15); }
        .topbar h1 { font-size: 1.3rem; margin-bottom: 4px; }
        .topbar p { font-size: .85rem; opacity: .85; }
        
        .container { flex: 1; padding: 20px 16px; max-width: 500px; margin: 0 auto; width: 100%; }
        
        .card { background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 3px 12px rgba(75,45,110,.08); border-left: 5px solid var(--dourado); text-decoration: none; color: inherit; display: flex; align-items: center; gap: 16px; transition: transform 0.1s; }
        .card:active { transform: scale(.98); }
        .card .ico { width: 50px; height: 50px; border-radius: 50%; background: #efe8f7; color: var(--roxo); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; flex-shrink: 0; border: 1px solid var(--dourado); }
        .card h3 { font-size: 1.1rem; color: var(--roxo); margin-bottom: 4px; }
        .card p { font-size: .85rem; color: #7a6f85; line-height: 1.3; }
        
        .footer { text-align: center; padding: 20px; color: #7a6f85; font-size: .8rem; }
    </style>
</head>
<body>

    <header class="topbar">
        <h1>Administração Paroquial</h1>
        <p>Paróquia São João Bosco</p>
    </header>

    <main class="container">
        
        <a href="../index.html" class="card">
            <div class="ico"><i class="fas fa-church"></i></div>
            <div>
                <h3>App Público</h3>
                <p>Voltar para o site da paróquia</p>
            </div>
        </a>

        <a href="padre/painel.html" class="card">
            <div class="ico"><i class="fas fa-user-tie"></i></div>
            <div>
                <h3>Painel do Padre</h3>
                <p>Acessar intenções e reflexões</p>
            </div>
        </a>

        <a href="secretaria/index.html" class="card">
            <div class="ico"><i class="fas fa-clipboard-list"></i></div>
            <div>
                <h3>Secretaria</h3>
                <p>Gerenciar avisos e Pascom</p>
            </div>
        </a>

    </main>

    <footer class="footer">
        &copy; 2026 Paróquia São João Bosco
    </footer>

</body>
</html>
